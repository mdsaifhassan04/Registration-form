<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body style="background: linear-gradient(135deg, #dff6ff, #e8ddff);">
    <table>
        <center><h1>Registration Form</h1></center>
    </table><br><br><br><br><br><br><br><br><br><br>
    <form>
    <table style="border-spacing: 12px 14px;">
        <tr>
            <td>
                <label for="name">Name:</label>
            </td>
            <td>
                <input type="text" name="name" placeholder="Enter your name" style="padding: 8px; border: 1px solid #b8c5e0; border-radius: 8px;" required>
            </td>
        </tr>
        <tr>
            <td>
                <label for="email">Email:</label>
            </td>
            <td>
                <input type="email" name="email" placeholder="Enter your email" style="padding: 8px; border: 1px solid #b8c5e0; border-radius: 8px;" required>
            </td>
        </tr>   
        <tr>
            <td>
                <label for="password">Password:</label>
            </td>
            <td>
                <input type="password" name="password" placeholder="Enter your password" style="padding: 8px; border: 1px solid #b8c5e0; border-radius: 8px;" required>
            </td>
        </tr>
        <tr>
            <td>
                <label for="department">Department:</label>
            </td>
            <td>
                <select name="department" style="padding: 8px; border: 1px solid #b8c5e0; border-radius: 8px;" required>
                    <option value="">Select your department</option>
                    <option value="computer_science">Computer Science</option>
                    <option value="electrical_engineering">Electrical Engineering</option>
                    <option value="mechanical_engineering">Mechanical Engineering</option>
                    <option value="civil_engineering">Civil Engineering</option>
                </select>
            </td>
        </tr>
    </table><br><br>
    <label>
        <input type="checkbox" name="terms" style="margin-right: 6px;" required> I agree to the <a href="#">terms and conditions</a>
    </label><br><br><br>
    <center>
        <button type="submit" style="background: linear-gradient(135deg, #6a5acd, #4169e1); color: white; border: none; border-radius: 24px; padding: 12px 32px; font-size: 16px; font-weight: bold; letter-spacing: 1px; box-shadow: 0 6px 14px rgba(65, 105, 225, 0.35); cursor: pointer;">Submit &rarr;</button>
        <button type="reset" style="background: transparent; color: #4169e1; border: 2px solid #4169e1; border-radius: 24px; padding: 10px 28px; margin-left: 10px; font-size: 16px; font-weight: bold; cursor: pointer;">Reset</button>
    </center>
    </form>
</body>
</html>
